<!DOCTYPE html>
<!-- index.html - the main page (HTML only). The table is filled in by assets/js/index.js -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scholarship Application Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- Navigation bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">🎓 Scholarship System</a>
    <a class="btn btn-light btn-sm" href="form.html">+ New Application</a>
  </div>
</nav>

<div class="container">

  <!-- Messages (success / error) appear here -->
  <div id="flash"></div>

  <!-- Dashboard cards -->
  <div class="row text-center g-3 mb-4">
    <div class="col-4"><div class="card border-warning shadow-sm"><div class="card-body">
      <h3 class="mb-0" id="count-Pending">0</h3><span class="text-muted">Pending</span></div></div></div>
    <div class="col-4"><div class="card border-success shadow-sm"><div class="card-body">
      <h3 class="mb-0" id="count-Approved">0</h3><span class="text-muted">Approved</span></div></div></div>
    <div class="col-4"><div class="card border-danger shadow-sm"><div class="card-body">
      <h3 class="mb-0" id="count-Rejected">0</h3><span class="text-muted">Rejected</span></div></div></div>
  </div>

  <!-- Search and filter -->
  <div class="row g-2 mb-3">
    <div class="col-md-8">
      <input id="searchBox" class="form-control" placeholder="Search by name, email, course or scholarship...">
    </div>
    <div class="col-md-4">
      <select id="statusFilter" class="form-select">
        <option value="">All statuses</option>
        <option>Pending</option>
        <option>Approved</option>
        <option>Rejected</option>
      </select>
    </div>
  </div>

  <!-- Applications table -->
  <div class="table-responsive shadow-sm">
    <table class="table table-striped table-hover bg-white align-middle mb-0" id="appTable">
      <thead class="table-dark">
        <tr>
          <th>#</th><th>Student</th><th>Course / Year</th><th>GPA</th>
          <th>Scholarship</th><th>Status</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="appBody">
        <tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr>
      </tbody>
    </table>
  </div>
  <p id="noResults" class="text-center text-muted py-4 d-none">No matching applications.</p>

</div>

<!-- Delete confirmation modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm delete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Delete the application of <strong id="deleteName"></strong>? This cannot be undone.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>
</div>

<footer class="text-center text-muted small py-4">Scholarship Application Management System</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/index.js"></script>
</body>
</html>
