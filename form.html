<!DOCTYPE html>
<!-- form.html - the Add / Edit form (HTML only). assets/js/form.js decides if it is Add or Edit. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Form - Scholarship System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">🎓 Scholarship System</a>
    <a class="btn btn-light btn-sm" href="index.html">← Back to list</a>
  </div>
</nav>

<div class="container">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-3" id="formTitle">New Scholarship Application</h4>

      <!-- Server validation errors appear here -->
      <div id="errors"></div>

      <form id="appForm" class="needs-validation" novalidate>
        <input type="hidden" name="id" id="id" value="0">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="student_name">Full Name</label>
            <input type="text" id="student_name" class="form-control" required>
            <div class="invalid-feedback">Please enter the full name.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-control" required>
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="course">Course</label>
            <input type="text" id="course" class="form-control" required>
            <div class="invalid-feedback">Please enter the course.</div>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="year_level">Year Level</label>
            <select id="year_level" class="form-select">
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label" for="gpa">GPA (1.00 - 5.00)</label>
            <input type="number" step="0.01" min="1" max="5" id="gpa" class="form-control" required>
            <div class="invalid-feedback">GPA must be 1.00 to 5.00.</div>
          </div>
          <div class="col-md-8">
            <label class="form-label" for="scholarship_id">Scholarship</label>
            <select id="scholarship_id" class="form-select"></select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="status">Status</label>
            <select id="status" class="form-select">
              <option>Pending</option>
              <option>Approved</option>
              <option>Rejected</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-4" id="saveBtn">Save Application</button>
        <a href="index.html" class="btn btn-secondary mt-4">Cancel</a>
      </form>
    </div>
  </div>
</div>

<footer class="text-center text-muted small py-4">Scholarship Application Management System</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/form.js"></script>
</body>
</html>
